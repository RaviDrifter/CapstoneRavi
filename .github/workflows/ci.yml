name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: cp .env.example .env
      - name: Run tests with coverage
        run: python -m pytest tests/ -v --cov=src --cov-report=term-missing --cov-fail-under=80
      - name: Check repository for likely credentials
        run: |
          if grep -RInE 'sk-or-v1-[A-Za-z0-9]{20,}|OPENROUTER_API_KEY=\S+' --exclude='.env.example' --exclude-dir='.git' --exclude-dir='reference_pack' .; then exit 1; else echo 'No likely committed API keys found.'; fi
